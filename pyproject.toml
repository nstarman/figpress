[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "figpress"
dynamic = ["version"]
description = "The home of the figpress family: packages for the figures of scientific papers, in print and on the web."
readme = "README.md"
license = "MIT"
authors = [{ name = "Nathaniel Starkman" }]
requires-python = ">=3.10"
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Visualization",
]

[project.urls]
Homepage = "https://nstarkman.space/figpress/"
Repository = "https://github.com/nstarman/figpress"

[project.scripts]
figpress = "figpress.__main__:main"

[tool.hatch.version]
path = "src/figpress/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/figpress"]

[tool.hatch.build.targets.wheel.force-include]
"family.json" = "figpress/family.json"

[tool.hatch.build.targets.sdist]
include = ["src/figpress", "family.json", "README.md", "LICENSE", "CHANGELOG.md"]
